[package]
name = "simple-table-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["engine"]
engine = [
    "dep:csv",
    "dep:formualizer-parse",
    "dep:formualizer-workbook",
    "dep:getrandom",
    "dep:image",
    "dep:sha2",
    "dep:tantivy",
    "dep:tantivy-jieba",
    "dep:thiserror",
    "dep:umya-spreadsheet",
    "dep:uuid",
    "dep:web-time",
    "dep:windows-sys",
    "dep:zip",
]

[dependencies]
csv = { version = "1.4", optional = true }
formualizer-parse = { version = "3.0.0", optional = true }
image = { version = "0.25", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = { version = "0.11", optional = true }
thiserror = { version = "2", optional = true }
umya-spreadsheet = { version = "3", optional = true }
uuid = { version = "1", features = ["v4", "serde", "rng-getrandom"], optional = true }
web-time = { version = "1.1", optional = true }
zip = { version = "8.6", default-features = false, features = ["deflate"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
formualizer-workbook = { version = "0.8.1", default-features = false, features = ["system-clock"], optional = true }
tantivy = { version = "0.26.1", optional = true }
tantivy-jieba = { version = "0.20.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
formualizer-workbook = { version = "0.8.1", default-features = false, features = ["js-runtime"], optional = true }
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"], optional = true }
