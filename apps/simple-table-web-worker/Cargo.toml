[package]
name = "simple-table-web-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
# Async wasm-bindgen exports and Wasm randomness use these without source paths.
ignored = ["getrandom", "wasm-bindgen-futures"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys.workspace = true
rexie.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
sha2.workspace = true
simple-table-engine.workspace = true
simple-table-protocol.workspace = true
simple-table-web-protocol.workspace = true
uuid = { workspace = true, features = ["v4", "serde", "rng-getrandom"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
