[package]
name = "simple-table"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "simple-table"

[package.metadata.cargo-machete]
# Hydration and the Wasm random backend are enabled through dependency features.
ignored = ["dioxus-web", "getrandom"]

[lints]
workspace = true

[features]
default = []
desktop = [
    "dep:reqwest",
    "dep:rfd",
    "dep:simple-table-engine",
    "dep:tokio",
    "dep:webbrowser",
    "dioxus/desktop",
]
mobile = [
    "dep:simple-table-engine",
    "dep:tokio",
    "dioxus/mobile",
]
web = [
    "dep:dioxus-web",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dioxus/web",
    "simple-table-components/web",
]
server = ["dioxus/fullstack", "dioxus/server"]

[dependencies]
base64.workspace = true
dioxus = { workspace = true, features = ["router"] }
dioxus-sdk-time.workspace = true
dioxus-web = { workspace = true, features = ["hydrate"], optional = true }
futures.workspace = true
js-sys = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"], optional = true }
rfd = { workspace = true, optional = true }
semver.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
serde-wasm-bindgen = { workspace = true, optional = true }
simple-table-engine = { workspace = true, optional = true }
simple-table-components.workspace = true
simple-table-protocol.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
uuid = { workspace = true, features = ["v4", "serde", "rng-getrandom"] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag", "Document", "Element", "ErrorEvent", "Event", "File", "FileList", "FileReader", "HtmlAnchorElement", "HtmlInputElement", "MessageEvent", "Response", "Url", "Window", "Worker", "WorkerOptions", "WorkerType"], optional = true }
web-time.workspace = true
webbrowser = { workspace = true, optional = true }

[dev-dependencies]
dioxus-ssr.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[target.'cfg(target_os = "android")'.dependencies]
manganis.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
dirs.workspace = true

[[bin]]
name = "simple-table"
path = "src/main.rs"
test = false
bench = false
