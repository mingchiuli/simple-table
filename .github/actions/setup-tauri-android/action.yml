name: Setup Tauri Android
description: Install the toolchains and initialize the generated Android project

inputs:
  ndk-version:
    description: Android NDK version
    default: r29

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{ inputs.ndk-version }}
        add-to-path: true
        link-to-sdk: true

    - name: Export Android NDK path
      shell: bash
      run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "lts/*"
        cache: npm

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: "./src-tauri -> target"

    - name: Install frontend dependencies
      shell: bash
      run: npm ci

    - name: Initialize Android project
      shell: bash
      run: npx tauri android init --ci --skip-targets-install
