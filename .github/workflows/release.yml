name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/quality.yml

  desktop:
    name: Desktop bundle (${{ matrix.os }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: dmg
          - os: ubuntu-22.04
            package: deb
          - os: windows-latest
            package: nsis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: 0.7.10
          locked: true

      - name: Build native package
        run: dx bundle --desktop --release --locked --no-default-features --features desktop --package-types "${{ matrix.package }}" --out-dir release-assets

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: simple-table-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  web-binary:
    name: Embedded Web SSR binary
    needs: quality-gate
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: 0.7.10
          locked: true

      - name: Install wasm-bindgen CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: wasm-bindgen-cli
          version: 0.2.127
          locked: true

      - name: Build embedded SSR binary
        run: cargo xtask bundle

      - name: Name release binary
        run: cp target/release/simple-table-web simple-table-web-x86_64-unknown-linux-gnu

      - name: Upload Web binary
        uses: actions/upload-artifact@v4
        with:
          name: simple-table-web-linux-x86_64
          path: simple-table-web-x86_64-unknown-linux-gnu
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [desktop, web-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "Simple Table $GITHUB_REF_NAME"
