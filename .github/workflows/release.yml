name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================
  # 第一步：统一创建 Draft Release
  # ============================================
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}

    steps:
      - name: Create Draft Release
        id: create
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: 'Simple Table ${{ github.ref_name }}'
          body: 'See the assets to download this version and install.'
          draft: true
          prerelease: false

  # ============================================
  # Desktop 构建 (macOS / Linux / Windows)
  # ============================================
  build-desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 使用已创建的 Release ID，不再自行创建 Release
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # ============================================
  # Android 构建
  # ============================================
  build-android:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Set NDK_HOME
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Init Android project
        run: npx tauri android init

      - name: Copy custom icons to Android project
        run: |
          cp -r src-tauri/icons/android/mipmap-* src-tauri/gen/android/app/src/main/res/
          cp -r src-tauri/icons/android/values src-tauri/gen/android/app/src/main/res/

      - name: Setup Android signing
        run: |
          cd src-tauri/gen/android
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > $RUNNER_TEMP/keystore.jks

      - name: Configure Gradle signing
        run: |
          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"

          # Step 1: 先读出原文件内容
          ORIGINAL=$(cat "$GRADLE_FILE")

          # Step 2: 重写文件 — 强制把两个 import 写在最前面
          cat > "$GRADLE_FILE" << 'HEADER'
          import java.util.Properties
          import java.io.FileInputStream
          HEADER

          # Step 3: 把原内容追加回去（去掉可能已有的重复 import）
          echo "$ORIGINAL" | grep -v '^import java.util.Properties' | grep -v '^import java.io.FileInputStream' >> "$GRADLE_FILE"

          # Step 4: 在 buildTypes 前插入 signingConfigs
          sed -i '/buildTypes {/i\
          \        signingConfigs {\
          \            create("release") {\
          \                val keystorePropertiesFile = rootProject.file("keystore.properties")\
          \                val keystoreProperties = Properties()\
          \                if (keystorePropertiesFile.exists()) {\
          \                    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\
          \                }\
          \                keyAlias = keystoreProperties["keyAlias"] as String\
          \                keyPassword = keystoreProperties["keyPassword"] as String\
          \                storeFile = file(keystoreProperties["storeFile"] as String)\
          \                storePassword = keystoreProperties["storePassword"] as String\
          \            }\
          \        }' "$GRADLE_FILE"

          # Step 5: 在 release buildType 中添加签名引用
          sed -i '/getByName("release") {/a\
          \                signingConfig = signingConfigs.getByName("release")' "$GRADLE_FILE"

          # Debug: 打印前50行验证
          echo "✅ build.gradle.kts 前50行:"
          head -50 "$GRADLE_FILE" | cat -n

      - name: Build Android APK
        run: npx tauri android build --apk

      - name: Upload APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 优先查找签名后的 release APK
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            gh release upload ${{ github.ref_name }} "$APK_PATH" --clobber
          else
            echo "::warning::No signed release APK found, uploading all APKs..."
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec \
              gh release upload ${{ github.ref_name }} {} --clobber \;
          fi