name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/quality.yml

  desktop:
    name: Desktop bundle (${{ matrix.os }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: dmg
          - os: ubuntu-22.04
            package: deb
          - os: windows-latest
            package: nsis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: 0.7.10
          locked: true

      - name: Build native package
        run: dx bundle --package simple-table --desktop --release --locked --no-default-features --features desktop --package-types "${{ matrix.package }}" --out-dir release-assets

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: simple-table-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  web-binary:
    name: Embedded Web SSR binary
    needs: quality-gate
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, x86_64-unknown-linux-musl

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: 0.7.10
          locked: true

      - name: Install wasm-bindgen CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: wasm-bindgen-cli
          version: 0.2.127
          locked: true

      - name: Build embedded SSR binary
        run: cargo xtask bundle --target x86_64-unknown-linux-musl

      - name: Name release binary
        run: cp target/release/simple-table-web simple-table-web-x86_64-unknown-linux-musl

      - name: Upload Web binary
        uses: actions/upload-artifact@v7
        with:
          name: simple-table-web-linux-x86_64-musl
          path: simple-table-web-x86_64-unknown-linux-musl
          if-no-files-found: error

  android:
    name: Android APK
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: 0.7.10
          locked: true

      - name: Configure Android NDK
        shell: bash
        run: |
          ndk_bin="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=${ndk_bin}/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=${ndk_bin}/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${ndk_bin}/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${ndk_bin}/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "$ndk_bin" >> "$GITHUB_PATH"

      - name: Ensure Android SDK Platform 36
        shell: bash
        run: |
          # dx's cargo-mobile2 project uses compileSdk = 36; install it if the
          # runner's preinstalled SDK is older (gradle would auto-download otherwise).
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager "platforms;android-36" >/dev/null || true
          fi

      - name: Setup Android release signing
        # dx only runs Gradle `assembleRelease` when a `[bundle.android]` signing
        # config exists in Dioxus.toml; without it `--release` silently falls back
        # to a debug APK. Inject the same keystore used by the legacy Tauri build.
        shell: bash
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE secret is empty; cannot sign the release APK. Configure the same keystore used by the Tauri release workflow." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > keystore.jks
          python3 - <<'PY'
          import os, pathlib
          path = pathlib.Path("Dioxus.toml")
          text = path.read_text()
          if "[bundle.android]" not in text:
              # jks_file is resolved relative to the generated Gradle app module,
              # which sits 7 levels below the workspace root, so "keystore.jks"
              # here points back at the repository root where we decoded it.
              section = (
                  "[bundle.android]\n"
                  'jks_file = "keystore.jks"\n'
                  f'jks_password = "{os.environ["KEYSTORE_PASSWORD"]}"\n'
                  f'key_alias = "{os.environ["KEY_ALIAS"]}"\n'
                  f'key_password = "{os.environ["KEY_PASSWORD"]}"\n'
              )
              text = text.rstrip() + "\n" + section
          path.write_text(text)
          PY

      - name: Build Android APK
        run: dx bundle --package simple-table --android --release --locked --no-default-features --features mobile --target aarch64-linux-android --package-types apk --out-dir release-assets

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: simple-table-android
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [desktop, web-binary, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "Simple Table $GITHUB_REF_NAME"
