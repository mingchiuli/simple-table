name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================
  # Desktop 构建 (macOS / Linux / Windows)
  # ============================================
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Simple Table ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ============================================
  # Android 构建
  # ============================================
  build-android:
    needs: build-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true
        id: setup-ndk

      # 关键修复 1: 必须显式设置 NDK_HOME 环境变量
      - name: Set NDK_HOME
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      # 关键修复 2: 拆分步骤 — 先 init
      - name: Init Android project
        run: npx tauri android init

      # 配置签名 - 写入 keystore.properties
      - name: Setup Android signing
        run: |
          cd src-tauri/gen/android
          cat > keystore.properties << EOF
          storePassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/keystore.jks
          EOF
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > $RUNNER_TEMP/keystore.jks

      # 修改 build.gradle.kts - 用 Python 精确控制
      - name: Configure Gradle signing
        run: |
          python3 << 'PYEOF'
          gradle_file = "src-tauri/gen/android/app/build.gradle.kts"

          with open(gradle_file, "r") as f:
              lines = f.readlines()

          result = []
          imports_added = False
          signing_config_added = False

          for i, line in enumerate(lines):
              # Step 1: Add imports at the very top (before first non-import, non-blank line)
              if not imports_added and not line.strip().startswith("import") and line.strip() != "":
                  # Check if imports already exist
                  header = "".join(lines[:i])
                  if "java.util.Properties" not in header:
                      result.append("import java.util.Properties\n")
                      result.append("import java.io.FileInputStream\n")
                      result.append("\n")
                  imports_added = True

              # Step 2: Before buildTypes, insert signingConfigs
              if not signing_config_added and line.strip().startswith("buildTypes"):
                  result.append("        signingConfigs {\n")
                  result.append('            create("release") {\n')
                  result.append('                val keystorePropertiesFile = rootProject.file("keystore.properties")\n')
                  result.append("                val keystoreProperties = Properties()\n")
                  result.append("                if (keystorePropertiesFile.exists()) {\n")
                  result.append("                    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n")
                  result.append("                }\n")
                  result.append("\n")
                  result.append('                keyAlias = keystoreProperties["keyAlias"] as String\n')
                  result.append('                keyPassword = keystoreProperties["keyPassword"] as String\n')
                  result.append('                storeFile = file(keystoreProperties["storeFile"] as String)\n')
                  result.append('                storePassword = keystoreProperties["storePassword"] as String\n')
                  result.append("            }\n")
                  result.append("        }\n")
                  result.append("\n")
                  signing_config_added = True

              # Step 3: Add signingConfig to release buildType
              if 'getByName("release")' in line:
                  result.append(line)
                  result.append('                signingConfig = signingConfigs.getByName("release")\n')
                  continue

              result.append(line)

          with open(gradle_file, "w") as f:
              f.writelines(result)

          # Debug output
          print("✅ Modified build.gradle.kts:")
          with open(gradle_file, "r") as f:
              for i, line in enumerate(f.readlines()[:60], 1):
                  print(f"  {i:3}: {line}", end="")
          PYEOF

      # 关键修复 5: 单独执行 build
      - name: Build Android APK
        run: npx tauri android build --apk

      # 关键修复 6: 精确上传签名后的 APK
      - name: Upload APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 优先查找签名后的 release APK
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            gh release upload ${{ github.ref_name }} "$APK_PATH" --clobber
          else
            echo "::warning::No signed release APK found, uploading all APKs..."
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec \
              gh release upload ${{ github.ref_name }} {} --clobber \;
          fi
