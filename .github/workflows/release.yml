name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ============================================
  # 发布前质量门禁：避免测试失败后仍创建 Release/上传产物
  # ============================================
  quality-gate:
    uses: ./.github/workflows/quality.yml

  # ============================================
  # 第一步：统一创建 Draft Release
  # ============================================
  create-release:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}

    steps:
      - name: Create or reuse Draft Release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --draft \
              --verify-tag \
              --title "Simple Table ${{ github.ref_name }}" \
              --notes "See the assets to download this version and install."
          fi

          release_id=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.id')
          echo "id=${release_id}" >> "$GITHUB_OUTPUT"

  # ============================================
  # Desktop 构建 (macOS / Linux / Windows)
  # ============================================
  build-desktop:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app with updater
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys for updater
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 使用已创建的 Release ID，不再自行创建 Release
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          # Updater configuration
          uploadUpdaterJson: true

  # ============================================
  # Android 构建
  # ============================================
  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true
          link-to-sdk: true

      - name: Set Android NDK env
        run: |
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Init Android project
        run: npx tauri android init

      - name: Copy custom icons to Android project
        run: |
          cp -r src-tauri/icons/android/mipmap-* src-tauri/gen/android/app/src/main/res/
          cp -r src-tauri/icons/android/values src-tauri/gen/android/app/src/main/res/

      - name: Setup Android signing
        run: |
          cd src-tauri/gen/android
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > $RUNNER_TEMP/keystore.jks

      - name: Configure Gradle signing
        run: |
          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"

          # Step 1: 先读出原文件内容
          ORIGINAL=$(cat "$GRADLE_FILE")

          # Step 2: 重写文件 — 强制把两个 import 写在最前面
          cat > "$GRADLE_FILE" << 'HEADER'
          import java.util.Properties
          import java.io.FileInputStream
          HEADER

          # Step 3: 把原内容追加回去（去掉可能已有的重复 import）
          echo "$ORIGINAL" | grep -v '^import java.util.Properties' | grep -v '^import java.io.FileInputStream' >> "$GRADLE_FILE"

          # Step 4: 在 buildTypes 前插入 signingConfigs
          sed -i '/buildTypes {/i\
          \        signingConfigs {\
          \            create("release") {\
          \                val keystorePropertiesFile = rootProject.file("keystore.properties")\
          \                val keystoreProperties = Properties()\
          \                if (keystorePropertiesFile.exists()) {\
          \                    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\
          \                }\
          \                keyAlias = keystoreProperties["keyAlias"] as String\
          \                keyPassword = keystoreProperties["keyPassword"] as String\
          \                storeFile = file(keystoreProperties["storeFile"] as String)\
          \                storePassword = keystoreProperties["storePassword"] as String\
          \            }\
          \        }' "$GRADLE_FILE"

          # Step 5: 在 release buildType 中添加签名引用
          sed -i '/getByName("release") {/a\
          \                signingConfig = signingConfigs.getByName("release")' "$GRADLE_FILE"

          # Debug: 打印前50行验证
          echo "✅ build.gradle.kts 前50行:"
          head -50 "$GRADLE_FILE" | cat -n

      - name: Build Android APK
        run: npx tauri android build --apk --target aarch64 --split-per-abi

      - name: Upload APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -path "*/arm64/release/*-release.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No arm64 release APK found"
            exit 1
          fi
          gh release upload ${{ github.ref_name }} "$APK_PATH" --clobber
