name: Quality Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust, SSR, and Web
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all non-mobile targets
        run: cargo xtask check

      - name: Run tests
        run: cargo xtask test

      - name: Run Web protocol and Worker tests
        run: cargo xtask test-web

  desktop-platforms:
    name: Desktop check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Check desktop target
        run: cargo check --locked -p simple-table --no-default-features --features desktop

  ios:
    name: iOS simulator check
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-ios-sim

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Lint iOS target
        run: >-
          cargo clippy --locked -p simple-table --target aarch64-apple-ios-sim
          --no-default-features --features mobile --all-targets --
          -Dwarnings -Dclippy::redundant_clone -Dclippy::clone_on_copy
          -Dclippy::implicit_clone

  android:
    name: Android arm64 check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Configure Android NDK
        shell: bash
        run: |
          ndk_bin="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=${ndk_bin}/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=${ndk_bin}/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${ndk_bin}/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${ndk_bin}/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "$ndk_bin" >> "$GITHUB_PATH"

      - name: Lint Android target
        run: >-
          cargo clippy --locked -p simple-table --target aarch64-linux-android
          --no-default-features --features mobile --all-targets --
          -Dwarnings -Dclippy::redundant_clone -Dclippy::clone_on_copy
          -Dclippy::implicit_clone
