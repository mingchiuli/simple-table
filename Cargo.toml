[package]
name = "simple-table"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "simple-table"

[workspace]
members = ["backend"]
resolver = "3"

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mingchiuli/simple-table"

[features]
default = ["desktop"]
tools = []
app = [
    "dep:base64",
    "dep:dioxus",
    "dep:dioxus-primitives",
    "dep:dioxus-sdk-time",
    "dep:futures",
    "dep:lucide-icons",
    "dep:semver",
    "dep:simple-table-engine",
]
engine = ["dep:simple-table-engine", "simple-table-engine/engine"]
desktop = [
    "app",
    "engine",
    "dioxus/desktop",
    "dep:reqwest",
    "dep:rfd",
    "dep:tokio",
    "dep:webbrowser",
]
mobile = ["app", "engine", "dioxus/mobile", "dep:reqwest", "dep:tokio"]
web = [
    "app",
    "dioxus/web",
    "dep:dioxus-web",
    "dioxus-primitives/web",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:web-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]
server = ["app", "dioxus/server", "dioxus/fullstack", "dep:axum", "dep:tokio"]
embedded-server = [
    "server",
    "dep:mime_guess",
    "dep:rust-embed",
    "dep:tempfile",
]
worker = [
    "engine",
    "dep:js-sys",
    "dep:rexie",
    "dep:serde-wasm-bindgen",
    "dep:sha2",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]

[dependencies]
base64 = { version = "0.23", optional = true }
dioxus = { version = "=0.7.10", features = ["router"], optional = true }
dioxus-primitives = { git = "https://github.com/DioxusLabs/dioxus-components.git", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", default-features = false, optional = true }
dioxus-sdk-time = { version = "=0.7.0", optional = true }
dioxus-web = { version = "=0.7.10", features = ["hydrate"], optional = true }
futures = { version = "0.3.34", optional = true }
lucide-icons = { version = "1.31.0", optional = true }
semver = { version = "1", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
simple-table-engine = { path = "backend", default-features = false, optional = true }
sha2 = { version = "0.11", optional = true }
uuid = { version = "1", features = ["v4", "serde", "rng-getrandom"] }

axum = { version = "0.8", optional = true }
js-sys = { version = "0.3", optional = true }
mime_guess = { version = "2", optional = true }
reqwest = { version = "0.13.4", features = ["json"], optional = true }
rexie = { version = "0.6.2", optional = true }
rfd = { version = "0.17.2", optional = true }
rust-embed = { version = "8.12.0", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "ErrorEvent", "Event", "File", "FileList", "FileReader", "HtmlAnchorElement", "HtmlInputElement", "MessageEvent", "Response", "Url", "Window", "Worker", "WorkerOptions", "WorkerType"], optional = true }
webbrowser = { version = "1.2.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[[bin]]
name = "simple-table"
path = "src/main.rs"

[[bin]]
name = "simple-table-web-worker"
path = "src/web_worker.rs"
required-features = ["worker"]
test = false
bench = false

[[bin]]
name = "simple-table-web"
path = "src/web_server.rs"
required-features = ["embedded-server"]
test = false
bench = false

[[bin]]
name = "xtask"
path = "src/xtask.rs"
test = false
bench = false

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[profile.server-release]
inherits = "release"

[profile.android-release]
inherits = "release"
