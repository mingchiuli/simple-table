[workspace]
members = [
    "apps/simple-table",
    "apps/simple-table-web-server",
    "apps/simple-table-web-worker",
    "crates/simple-table-components",
    "crates/simple-table-engine",
    "crates/simple-table-protocol",
    "crates/simple-table-web-protocol",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mingchiuli/simple-table"
publish = false

[workspace.dependencies]
simple-table = { path = "apps/simple-table", default-features = false }
simple-table-components = { path = "crates/simple-table-components", default-features = false }
simple-table-engine = { path = "crates/simple-table-engine" }
simple-table-protocol = { path = "crates/simple-table-protocol" }
simple-table-web-protocol = { path = "crates/simple-table-web-protocol" }

axum = "0.8"
base64 = "0.23"
csv = "1.4"
dioxus = "=0.7.10"
dioxus-sdk-time = "0.7.0"
dioxus-ssr = "=0.7.10"
dioxus-web = "=0.7.10"
dirs = "6"
formualizer-parse = "3.0.0"
formualizer-workbook = { version = "0.8.4", default-features = false }
futures = "0.3.34"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
js-sys = "0.3"
manganis = "=0.7.10"
mime_guess = "2"
reqwest = "0.13.4"
rexie = "0.6.2"
rfd = "0.17.2"
rust-embed = "8.12.0"
semver = "1"
serde = "1"
serde_bytes = "0.11"
serde_json = "1"
serde-wasm-bindgen = "0.6.5"
sha2 = "0.11"
tantivy = { version = "0.26.1", default-features = false }
tantivy-jieba = "0.20.0"
tempfile = "3"
thiserror = "2"
tokio = "1"
umya-spreadsheet = "3.1.0"
uuid = "1.25.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "=0.3.77"
web-sys = "0.3"
web-time = "1.1"
webbrowser = "1.2.4"
windows-sys = "0.61"
zip = { version = "8.6", default-features = false }

[workspace.lints.clippy]
clone_on_copy = "deny"
implicit_clone = "deny"
redundant_clone = "deny"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.dev.package.simple-table]
opt-level = 1

[profile.dev.package.simple-table-engine]
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[profile.server-release]
inherits = "release"

[profile.android-release]
inherits = "release"
