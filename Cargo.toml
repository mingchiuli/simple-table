[workspace]
members = [
    "apps/simple-table",
    "apps/simple-table-web-server",
    "apps/simple-table-web-worker",
    "crates/simple-table-engine",
    "crates/simple-table-protocol",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.13.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/mingchiuli/simple-table"
publish = false

[workspace.dependencies]
simple-table = { path = "apps/simple-table", default-features = false }
simple-table-engine = { path = "crates/simple-table-engine" }
simple-table-protocol = { path = "crates/simple-table-protocol" }

axum = "0.8"
base64 = "0.23"
csv = "1.4"
dioxus = "=0.7.10"
# Dioxus Primitives is not published as a usable crates.io release yet.
dioxus-primitives = { git = "https://github.com/DioxusLabs/dioxus-components.git", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", default-features = false }
dioxus-sdk-time = "0.7.0"
dioxus-web = "=0.7.10"
dirs = "6"
formualizer-parse = "3.0.0"
formualizer-workbook = { version = "0.8.1", default-features = false }
futures = "0.3.34"
getrandom = "0.4"
image = "0.25"
js-sys = "0.3"
lucide-icons = "1.31.0"
manganis = "=0.7.10"
mime_guess = "2"
reqwest = "0.13.4"
rexie = "0.6.2"
rfd = "0.17.2"
rust-embed = "8.12.0"
semver = "1"
serde = "1"
serde_json = "1"
serde-wasm-bindgen = "0.6.5"
sha2 = "0.11"
tantivy = "0.26.1"
tantivy-jieba = "0.20.0"
tempfile = "3"
thiserror = "2"
tokio = "1"
umya-spreadsheet = "3"
uuid = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
web-time = "1.1"
webbrowser = "1.2.4"
windows-sys = "0.61"
zip = { version = "8.6", default-features = false }

[workspace.lints.clippy]
clone_on_copy = "deny"
implicit_clone = "deny"
redundant_clone = "deny"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.dev.package.simple-table]
opt-level = 1

[profile.dev.package.simple-table-engine]
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[profile.server-release]
inherits = "release"

[profile.android-release]
inherits = "release"
